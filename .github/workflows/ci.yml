name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Branches cancel their stale run. Every run on main gets its own group, so a merge never cancels a deploy in flight.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, contabo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use a Docker config of its own
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            ln -s "$HOME/.docker/cli-plugins" "$RUNNER_TEMP/docker/cli-plugins"
          fi
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: true
          cache: false

      - run: mise run check

      - name: Build image
        run: docker build --platform linux/amd64 --tag music-library:ci .

      - name: Build beets-flask image
        run: docker build --platform linux/amd64 --tag music-library-beets-flask:ci beets-flask

      - run: mise run test

  # No human reviews pull requests: a branch whose checks passed is merged here.
  merge:
    needs: check
    if: github.ref != 'refs/heads/main'
    runs-on: [self-hosted, contabo]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: rn-ax/poppycock/.github/actions/merge-pr@main

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, contabo]
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use a Docker config of its own
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            ln -s "$HOME/.docker/cli-plugins" "$RUNNER_TEMP/docker/cli-plugins"
          fi
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - id: version
        uses: rn-ax/poppycock/.github/actions/calver@main

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: docker

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/rn-ax/music-library:latest
            ghcr.io/rn-ax/music-library:${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: beets-flask
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/rn-ax/music-library-beets-flask:latest
            ghcr.io/rn-ax/music-library-beets-flask:${{ steps.version.outputs.version }}

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, contabo]
    timeout-minutes: 30
    env:
      TRUENAS_URL: ${{ vars.TRUENAS_URL }}
      TRUENAS_USERNAME: ${{ vars.TRUENAS_USERNAME }}
      TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: latest
        uses: rn-ax/poppycock/.github/actions/is-latest-main@main

      - if: steps.latest.outputs.current == 'true'
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: true
          cache: false

      - if: steps.latest.outputs.current == 'true'
        run: uv run scripts/deploy.py "${{ needs.publish.outputs.version }}"
