plugins: [inline, musicbrainz, info, fetchart, embedart, convert, fromfilename, duplicates, edit, missing]

directory: /music

# Importing from the GUI is an explicit review step, so it writes tags. beets-flask only accepts copy: yes with move: no.
import:
  copy: yes
  move: no
  write: yes
  quiet_fallback: skip
  duplicate_action: ask

# Artist/Album (Year)/NN Title, with a disc prefix on multi-disc albums and singles directly under the artist.
item_fields:
  multidisc: 1 if disctotal > 1 else 0

paths:
  default: $albumartist/$album ($year)/%if{$multidisc,$disc-}$track $title
  comp: Compilations/$album ($year)/%if{$multidisc,$disc-}$track $artist - $title
  singleton: $artist/$title
