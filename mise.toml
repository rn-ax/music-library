[tools]
python = "3.14"
uv = "0.13.6"

[tasks.check]
description = "Validate the compose file"
run = "docker compose config --quiet"

[tasks.test]
description = "Run the acceptance tests against the built image"
env = { IMAGE = "music-library:ci", BEETS_FLASK_IMAGE = "music-library-beets-flask:ci" }
run = "uv run pytest tests"
